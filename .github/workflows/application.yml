name: Application workflow
on:
  workflow_run:
    workflows: ["learn terraform workflow"]
    types:
      - completed
jobs:
  test:
    if: ${{github.event.workflow_run.conclusion == 'success'}}
    runs-on: ubuntu-latest
    env:
      TF_VAR_SECRET_KEY: ${{secrets.SECRET_KEY}}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Checkout Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.10
      - name: Checkout Django
        run: python -m django --version
      - name: Install Requirements
        run: |
          pip install --upgrade pip
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
      - name: run formatting
        run: black .
      - name: run linting
        run: ruff check
      - name: run tests
        run: |
          source venv/bin/activate
          python manage.py test crm

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Checkout Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.10
      - name: Install Requirements
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Setup ghcr
        uses: docker/login-action@v2
        with:
            registry: ghcr.io
            username: ${{ secrets.GHCR_USER_NAME }}
            password: ${{ secrets.GHCR_AUTH_TOKEN }}
      - name: build docker image
        run: docker build -t ghcr.io/aswinikumaran/first_docker_image .

      - name: push docker image
        run: docker push ghcr.io/aswinikumaran/first_docker_image

      - name: Deploy application
        run: curl -x requests.POST "${{secrets.DEPLOY_HOOK_KEY}}"



